name: Build and test bundled SMDesigner
on:
  workflow_dispatch:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, macos-15-intel, ubuntu-22.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'setuptools>=77' wheel build
      - run: python scripts/build_r2r.py
      - run: python -W error -m unittest discover -s tests -v
      - run: python -m build --no-isolation
      - name: Install wheel in a clean environment and run real R2R
        shell: bash
        run: |
          python -m venv "$RUNNER_TEMP/smd-installed"
          "$RUNNER_TEMP/smd-installed/bin/python" -m pip install --no-deps dist/*.whl
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/smd-installed/bin/python" "$GITHUB_WORKSPACE/scripts/smoke_test.py"
      - uses: actions/upload-artifact@v4
        with:
          name: SMDesigner-${{ matrix.os }}
          path: dist/*
